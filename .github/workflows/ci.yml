name: Security and integration CI

on:
  pull_request:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cms
    steps:
      - name: Checkout plugin
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout CMS integration branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kurumonn/kururuDjangoCMS
          ref: bdb7f518fe471a2471a9e168dbb3040e42b39ed5  # pragma: allowlist secret
          path: cms

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-audit.lock
            cms/requirements.lock

      - name: Install test and audit dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --require-hashes -r cms/requirements.lock
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --editable .

      - name: Run plugin tests
        run: >-
          python cms/manage.py test tests.test_contact_forms tests.test_release_contract
          --settings=tests.settings --verbosity 2

      - name: Check migrations
        run: >-
          python cms/manage.py makemigrations contact_forms
          --check --dry-run --settings=tests.settings

      - name: Run deployment checks
        run: >-
          python cms/manage.py check --deploy --fail-level WARNING
          --settings=tests.deploy_settings

      - name: Run Bandit
        run: bandit -r contact_forms -x contact_forms/migrations -ll

      - name: Audit runtime dependencies
        run: |
          audit_with_retry() {
            for attempt in 1 2; do
              "$@" && return 0
              [ "$attempt" -eq 2 ] && return 1
              sleep 5
            done
          }
          audit_with_retry pip-audit --requirement requirements-audit.lock
          audit_with_retry pip-audit --vulnerability-service osv --requirement requirements-audit.lock

      - name: Check committed files for secrets
        run: python scripts/check_secrets.py

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Verify clean wheel installation and entry point
        run: |
          python -m venv /tmp/kururu-wheel-verify
          /tmp/kururu-wheel-verify/bin/python -m pip install --upgrade pip==25.3
          /tmp/kururu-wheel-verify/bin/python -m pip install --require-hashes -r cms/requirements.lock
          /tmp/kururu-wheel-verify/bin/python -m pip install --no-deps dist/kururucms_contact_forms-0.2.2-py3-none-any.whl
          /tmp/kururu-wheel-verify/bin/python scripts/verify_wheel.py
