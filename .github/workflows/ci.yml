name: Security and integration CI

on:
  pull_request:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cms
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout CMS integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kurumonn/kururuDjangoCMS
          ref: integration/plugin-platform-20260830
          path: cms

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-audit.txt
            cms/requirements.txt

      - name: Install test and audit dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r cms/requirements.txt
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --editable .

      - name: Run plugin tests
        run: >-
          python cms/manage.py test tests.test_contact_forms
          --settings=tests.settings --verbosity 2

      - name: Check migrations
        run: >-
          python cms/manage.py makemigrations contact_forms
          --check --dry-run --settings=tests.settings

      - name: Run deployment checks
        run: >-
          python cms/manage.py check --deploy --fail-level WARNING
          --settings=tests.deploy_settings

      - name: Run Bandit
        run: bandit -r contact_forms -x contact_forms/migrations -ll

      - name: Audit runtime dependencies
        run: |
          pip-audit --requirement requirements-audit.txt
          pip-audit --vulnerability-service osv --requirement requirements-audit.txt

      - name: Check committed files for secrets
        run: python scripts/check_secrets.py

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify clean wheel installation and entry point
        run: |
          python -m venv /tmp/kururu-wheel-verify
          /tmp/kururu-wheel-verify/bin/python -m pip install --upgrade pip==25.3
          /tmp/kururu-wheel-verify/bin/python -m pip install dist/kururucms_contact_forms-0.2.0-py3-none-any.whl
          /tmp/kururu-wheel-verify/bin/python scripts/verify_wheel.py
