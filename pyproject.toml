[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kururucms-contact-forms"
version = "0.2.2"
description = "Secure, reusable contact form plugin for KururuCMS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Django>=5.2,<5.3"]

[project.entry-points."kururucms.plugins"]
contact_forms = "contact_forms.apps:ContactFormsConfig"

[tool.setuptools.packages.find]
include = ["contact_forms*"]

[tool.setuptools.package-data]
contact_forms = ["templates/**/*.html"]
